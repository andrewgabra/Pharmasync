<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PharmaSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script src="/auth.js"></script>
<script>
// "GAS_URL" is kept as the legacy "is cloud sync enabled?" flag throughout
// the app (originally the Apps Script URL). It now just means "Supabase is
// configured" — set to a non-empty value once SUPABASE_URL is filled in.
const SCRIPT_URL = (window.SUPABASE_URL && window.SUPABASE_URL !== 'PASTE_SUPABASE_PROJECT_URL_HERE')
  ? window.SUPABASE_URL
  : '';
</script>
<style>
:root{
  --bg:#f4fbfb;--s1:#ffffff;--s2:#eaf6f6;--s3:#d5eded;--bd:#b8dfdf;
  --ac:#0d9488;--acg:rgba(13,148,136,.09);--ac2:#0891b2;
  --tx:#0d3333;--mu:#5a8f8f;--di:#b0d0d0;
  --er:#dc2626;--wa:#b45309;--pu:#6d28d9;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
  --sh:0 1px 3px rgba(13,148,136,.08),0 4px 12px rgba(13,148,136,.06);
  --sh-md:0 4px 16px rgba(13,148,136,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 60% 0%,rgba(13,148,136,.07),transparent 60%),radial-gradient(ellipse 40% 30% at 0% 80%,rgba(8,145,178,.05),transparent);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:28px 20px 100px}

/* HEADER */
.hdr{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--bd);margin-bottom:28px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,#0d9488,#0891b2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-1px;flex-shrink:0;box-shadow:0 4px 12px rgba(13,148,136,.3)}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--ac)}
.hdr-sub{font-size:11px;color:var(--mu);margin-top:1px;letter-spacing:.2px}
.step-badge{font-size:11px;font-weight:600;color:#fff;background:var(--ac);padding:4px 13px;border-radius:20px;white-space:nowrap;letter-spacing:.3px}

/* MODE SELECTOR */
.mode-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.mode-card{background:var(--s1);border:2px solid var(--bd);border-radius:14px;padding:28px 24px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:var(--sh)}
.mode-card:hover{border-color:var(--ac);background:var(--acg);transform:translateY(-2px);box-shadow:var(--sh-md)}
.mode-card.sel{border-color:var(--ac);background:var(--acg);box-shadow:0 0 0 3px rgba(13,148,136,.15),var(--sh-md)}
.mode-icon{font-size:34px;margin-bottom:12px}
.mode-title{font-size:17px;font-weight:700;margin-bottom:5px;color:var(--ac)}
.mode-desc{font-size:12px;color:var(--mu);line-height:1.6}

/* STEPPER */
.stepper{display:flex;position:relative;margin-bottom:30px}
.stepper::before{content:'';position:absolute;top:15px;left:30px;right:30px;height:2px;background:var(--bd);border-radius:2px}
.sdot{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;cursor:pointer}
.scirc{width:30px;height:30px;border-radius:50%;background:var(--s1);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--mu);z-index:1;transition:all .25s;box-shadow:var(--sh)}
.sdot.active .scirc{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 0 4px rgba(13,148,136,.18),0 2px 8px rgba(13,148,136,.3)}
.sdot.done .scirc{background:var(--acg);color:var(--ac);border-color:var(--ac)}
.slabel{font-size:10px;font-weight:500;color:var(--di);text-align:center;letter-spacing:.3px;text-transform:uppercase;line-height:1.2}
.sdot.active .slabel{color:var(--ac);font-weight:700}.sdot.done .slabel{color:var(--mu)}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.card-label{font-size:11px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-label::before{content:'';width:3px;height:12px;background:var(--ac);border-radius:2px;flex-shrink:0}
.panel-head{margin-bottom:20px}
.panel-head h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px;color:var(--tx)}
.panel-head p{font-size:12px;color:var(--mu);line-height:1.6}

/* DROP ZONE */
.drop{border:2px dashed var(--bd);border-radius:10px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--ac);background:var(--acg)}
.drop.loaded{border-color:var(--ac);background:rgba(13,148,136,.05);border-style:solid}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-icon{font-size:26px;margin-bottom:8px}
.drop h3{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--tx)}
.drop p{font-size:12px;color:var(--mu)}
.drop.loaded p,.drop.loaded h3{color:var(--ac)}

/* INPUTS */
.colmap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
select,input[type=text],input[type=email],input[type=number],input[type=date],textarea{
  width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:8px;
  color:var(--tx);font-family:var(--mono);font-size:13px;padding:9px 12px;
  outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
select:focus,input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
select option{background:var(--s1)}
textarea{resize:vertical;min-height:75px;font-size:12px;font-family:var(--mono)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px;text-align:center;box-shadow:var(--sh)}
.stat-n{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ac);line-height:1;margin-bottom:5px}
.stat-l{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;line-height:1.4}
.stat.red .stat-n{color:var(--er)}.stat.yellow .stat-n{color:var(--wa)}.stat.blue .stat-n{color:var(--ac2)}.stat.pu .stat-n{color:var(--pu)}

/* TABLE */
.tbl-wrap{border:1px solid var(--bd);border-radius:10px;overflow:hidden;overflow-x:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
thead tr{background:var(--s2)}
th{padding:10px 12px;text-align:left;color:var(--mu);font-weight:600;font-size:10px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--bd)}
td{padding:8px 12px;border-top:1px solid var(--s3);color:var(--tx);white-space:nowrap;vertical-align:middle}
tr:hover td{background:rgba(13,148,136,.03)}
td.zero{color:var(--di)}td.disc{color:var(--ac);font-weight:600}td.old{text-decoration:line-through;color:var(--mu)}td.edited{color:var(--wa)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;white-space:nowrap;letter-spacing:.1px}
.btn-primary{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(13,148,136,.25)}
.btn-primary:hover{background:#0b7c71;box-shadow:0 4px 14px rgba(13,148,136,.35);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.btn-ghost:hover{border-color:var(--ac);color:var(--ac);background:var(--acg)}
.btn-blue{background:rgba(8,145,178,.08);color:var(--ac2);border:1px solid rgba(8,145,178,.2)}
.btn-blue:hover{background:rgba(8,145,178,.15)}
.btn-red{background:rgba(220,38,38,.07);color:var(--er);border:1px solid rgba(220,38,38,.18)}
.btn-red:hover{background:rgba(220,38,38,.13)}
.btn-pu{background:rgba(109,40,217,.08);color:var(--pu);border:1px solid rgba(109,40,217,.2)}
.btn-wa{background:rgba(180,83,9,.08);color:var(--wa);border:1px solid rgba(180,83,9,.2)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-xs{padding:3px 9px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--bd)}

/* ALERTS */
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:9px;font-size:12px;margin-bottom:13px;line-height:1.5;font-weight:500}
.alert-info{background:rgba(8,145,178,.07);border:1px solid rgba(8,145,178,.2);color:var(--ac2)}
.alert-warn{background:rgba(180,83,9,.07);border:1px solid rgba(180,83,9,.2);color:var(--wa)}
.alert-success{background:var(--acg);border:1px solid rgba(13,148,136,.25);color:var(--ac)}
.alert-er{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2);color:var(--er)}

/* CHIPS */
.toolbar{display:flex;gap:8px;align-items:flex-end;margin-bottom:11px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd);color:var(--mu);background:var(--s1);transition:all .15s;user-select:none}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.on{background:var(--acg);border-color:rgba(13,148,136,.4);color:var(--ac);font-weight:600}
.chip.s-active{background:rgba(8,145,178,.08);border-color:rgba(8,145,178,.3);color:var(--ac2)}
.chip.s-zero{background:rgba(220,38,38,.06);border-color:rgba(220,38,38,.2);color:var(--er)}
.chip.d-disc{background:var(--acg);border-color:rgba(13,148,136,.3);color:var(--ac)}

/* PAGER */
.pager{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:11px;flex-wrap:wrap}
.pg{width:28px;height:28px;border-radius:6px;background:var(--s1);border:1px solid var(--bd);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;transition:all .15s}
.pg:hover,.pg.on{border-color:var(--ac);color:var(--ac);background:var(--acg)}
.pg-info{font-size:11px;color:var(--mu);margin:0 5px}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(13,51,51,.4);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-ov.open{display:flex}
.modal-box{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:26px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(13,148,136,.15)}
.modal-box h3{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--tx)}
.modal-box p{font-size:12px;color:var(--mu);margin-bottom:16px;line-height:1.6}
.modal-close{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--mu);cursor:pointer;font-size:18px;line-height:1;border-radius:4px;padding:2px}
.modal-close:hover{color:var(--er);background:rgba(220,38,38,.08)}
.modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* OUTPUT CARDS */
.output-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.output-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--s3);cursor:pointer;user-select:none;transition:background .15s}
.output-header:hover{background:var(--s2)}
.output-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.2px}
.ob-chefaa{background:rgba(8,145,178,.1);color:var(--ac2);border:1px solid rgba(8,145,178,.25)}
.ob-vezeeta{background:rgba(109,40,217,.1);color:var(--pu);border:1px solid rgba(109,40,217,.22)}
.ob-instashop{background:rgba(13,148,136,.1);color:var(--ac);border:1px solid rgba(13,148,136,.25)}
.ob-talabat{background:rgba(220,38,38,.08);color:var(--er);border:1px solid rgba(220,38,38,.2)}
.ob-stock{background:rgba(180,83,9,.08);color:var(--wa);border:1px solid rgba(180,83,9,.2)}
.ob-wa{background:rgba(180,83,9,.08);color:var(--wa);border:1px solid rgba(180,83,9,.2)}
.output-title{font-size:13px;font-weight:600;color:var(--tx)}
.output-meta{font-size:11px;color:var(--mu);margin-left:auto}
.output-body{padding:18px;background:var(--bg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.fgrid.full{grid-template-columns:1fr}

/* ANALYTICS */
.ana-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.ana-stat{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}
.ana-stat-left .n{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ac);line-height:1}
.ana-stat-left .l{font-size:11px;font-weight:500;color:var(--mu);margin-top:3px}
.ana-delta{font-size:13px;font-weight:700}
.delta-up{color:var(--ac)}.delta-dn{color:var(--er)}.delta-nc{color:var(--mu)}

/* MISC */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-g{background:var(--acg);color:var(--ac)}.badge-r{background:rgba(220,38,38,.08);color:var(--er)}.badge-y{background:rgba(180,83,9,.08);color:var(--wa)}
.opt-tag{font-size:10px;font-weight:600;background:var(--s2);color:var(--mu);padding:2px 8px;border-radius:20px;margin-left:7px;border:1px solid var(--bd)}
.divider{border:none;border-top:1px solid var(--bd);margin:14px 0}
.edit-btn{background:rgba(180,83,9,.07);border:1px solid rgba(180,83,9,.2);color:var(--wa);border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.edit-btn:hover{background:rgba(180,83,9,.14)}
.audit-row{display:flex;gap:9px;font-size:11px;padding:8px 0;border-top:1px solid var(--s3);align-items:flex-start;flex-wrap:wrap}
.audit-time{color:var(--mu);flex-shrink:0;font-family:var(--mono)}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--s2)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--mu)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .3s ease}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}.colmap{grid-template-columns:1fr 1fr}.fgrid{grid-template-columns:1fr}.ana-grid{grid-template-columns:1fr}.mode-wrap{grid-template-columns:1fr}.slabel{display:none}}
/* TOAST */
#toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:toastIn .25s ease,toastOut .3s ease 2.7s forwards;max-width:340px;line-height:1.4}
.toast-success{background:var(--ac);color:var(--tx)}
.toast-warn{background:var(--wa)}
.toast-er{background:var(--er)}
.toast-info{background:var(--ac2)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo">Rx</div>
    <div><div class="hdr-title">PharmaSync</div><div class="hdr-sub">Stock Export Manager — G Pharmacy</div></div>
    <div style="display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap">
      <span id="sync-status" style="font-size:11px;color:var(--mu);font-family:var(--mono)"></span>
      <button id="admin-btn" class="btn btn-ghost btn-sm" onclick="openAdminLogin()" style="font-size:11px">🔐 Sign In</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleAuditPanel()" style="font-size:11px">📋 Audit Log</button>
      <button class="btn btn-ghost btn-sm" onclick="resetMode()" style="font-size:11px">⟳ Mode</button>
      <div class="step-badge" id="step-badge">SELECT MODE</div>
    </div>
  </div>
  <!-- Audit Panel -->
  <div id="audit-panel" style="display:none;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:22px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="card-label" style="margin:0">Price Audit Log</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="openVersionHistory('discounts')" style="font-size:11px">⏱ Discount Versions</button>
        <button class="btn btn-ghost btn-sm" onclick="openVersionHistory('priceEdits')" style="font-size:11px">⏱ Price Versions</button>
        <button class="btn btn-red btn-sm" onclick="clearAuditLog()">🗑 Clear</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleAuditPanel()">✕</button>
      </div>
    </div>
    <div id="audit-panel-content"><div style="font-family:var(--mono);font-size:12px;color:var(--mu)">No price edits logged yet.</div></div>
  </div>
  <div id="content" class="anim"></div>
  <div class="nav" id="nav"></div>
</div>
<div class="modal-ov" id="modal-ov"><div class="modal-box" id="modal-box"></div></div>
<div id="toast-wrap"></div>
<script>
// ══════════════════════════════════════════════════════════════════════
// TOAST & CONFIRM (replaces alert/confirm blocked in sandboxed iframes)
// ══════════════════════════════════════════════════════════════════════
function toast(msg,type='success',duration=3000){
  const wrap=document.getElementById('toast-wrap');if(!wrap)return;
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{try{wrap.removeChild(el);}catch(e){}},duration+300);
}
// Custom confirm using modal — calls onOk if user confirms
function psConfirm(msg,onOk,onCancel){
  openModal(`<h3 style="margin-bottom:10px">⚠ Confirm</h3>
    <p style="margin-bottom:18px">${esc(msg)}</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="closeModal();(${onOk})()">Yes, proceed</button>
      <button type="button" class="btn btn-ghost" onclick="closeModal()${onCancel?`;(${onCancel})()`:''}">Cancel</button>
    </div>`);
}

// ══════════════════════════════════════════════════════════════════════
// CLOUD API — Supabase + Vercel API routes (replaces Google Apps Script)
// ══════════════════════════════════════════════════════════════════════
// All write actions go through /api/* serverless routes which verify the
// user's Supabase session and role before touching the database. The
// browser never holds a service-role key — only Auth's session token.

function setSyncStatus(state){
  S.syncStatus=state;
  const el=document.getElementById('sync-status');
  if(!el)return;
  const map={
    idle:['',''],
    syncing:['🔄 Syncing…','var(--mu)'],
    ok:['☁️ Synced','var(--ac)'],
    error:['⚠️ Offline','var(--er)'],
  };
  const[label,color]=map[state]||map.idle;
  el.textContent=label;el.style.color=color;
}

async function cloudLoad() {
  if(!GAS_URL) return; // GAS_URL repurposed below as "cloud enabled" flag
  setSyncStatus('syncing');
  const r = await Auth.api('/api/data');
  if (r?.ok) {
    if (r.discounts)  S.discounts  = r.discounts;
    if (r.priceEdits) S.priceEdits = r.priceEdits;

// Batch audit — flush every 5s or when >20 pending
function queueAuditSync(entries) {
  if (!GAS_URL || !S.isAdmin) return;
  CLOUD.pendingAudit.push(...entries);
  clearTimeout(CLOUD.syncTimer);
  if (CLOUD.pendingAudit.length>=20) flushAudit();
  else CLOUD.syncTimer = setTimeout(flushAudit, 5000);
}
async function flushAudit() {
  if (!GAS_URL || !S.isAdmin || !CLOUD.pendingAudit.length) return;
  const toSend = [...CLOUD.pendingAudit]; CLOUD.pendingAudit = [];
  await Auth.api('/api/audit-batch', { method:'POST', body:{ entries:toSend } });
}

// PRICE PARSING
// ══════════════════════════════════════════════════════════════════════
function parsePrice(v){
  if(v===null||v===undefined||v==='')return 0;
  const c=String(v).replace(/[£$€EGP\s]/gi,'').replace(/,(?=\d{3})/g,'').replace(/,/g,'');
  const n=parseFloat(c);return isNaN(n)?0:n;
}

// ══════════════════════════════════════════════════════════════════════
// FUZZY SEARCH
// ══════════════════════════════════════════════════════════════════════
function levenshtein(a,b){
  if(!a.length)return b.length;if(!b.length)return a.length;
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function fuzzyMatch(needle,hay){
  if(!needle)return true;
  const n=needle.toLowerCase().trim(),h=hay.toLowerCase();
  if(h.includes(n))return true;
  let j=0;for(let i=0;i<h.length&&j<n.length;i++)if(h[i]===n[j])j++;
  if(j===n.length)return true;
  const words=h.split(/[\s\-_\/]+/);
  const maxDist=Math.max(1,Math.floor(n.length/3.5));
  return words.some(w=>w.length>=2&&levenshtein(n,w.slice(0,n.length+3))<=maxDist);
}

function parseFile(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary',raw:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
      cb(data,data.length?Object.keys(data[0]):[]);
    }catch(ex){toast('Error reading file: '+ex.message,'er');}
  };
  r.readAsBinaryString(file);
}
function autoDetect(headers){
  const f=re=>headers.find(h=>re.test(h))||'';
  return{
    sku:f(/internal.?ref|sku|item.?code|^code$/i)||headers[0]||'',
    name:f(/product.?name|^name$|desc/i)||'',
    price:f(/sales.?price|sell.?price|^price$/i)||'',
    stock:f(/qty.?on.?hand|quantity.?on.?hand|^stock$|^qty$/i)||'',
    barcode:f(/barcode|ean|upc/i)||'',
    origin:f(/origin.?type|origin|type|category/i)||'',
    cost:f(/^cost$|cost.?price|purchase/i)||'',
  };
}

function resolveAuditEmail(){

// UNDO / REDO
// ══════════════════════════════════════════════════════════════════════
function snapshotHistory(){
  S.history.push({discounts:{...S.discounts},priceEdits:{...S.priceEdits}});
  if(S.history.length>50)S.history.shift();
  S.future=[];updateUndoRedoBtns();
}
function undo(){
  if(!S.history.length)return;
  S.future.push({discounts:{...S.discounts},priceEdits:{...S.priceEdits}});
  const p=S.history.pop();S.discounts={...p.discounts};S.priceEdits={...p.priceEdits};
  saveDisc();savePE();updateDiscTable();updateUndoRedoBtns();
}
function redo(){
  if(!S.future.length)return;
  S.history.push({discounts:{...S.discounts},priceEdits:{...S.priceEdits}});
  const n=S.future.pop();S.discounts={...n.discounts};S.priceEdits={...n.priceEdits};
  saveDisc();savePE();updateDiscTable();updateUndoRedoBtns();
}
function updateUndoRedoBtns(){
  const u=document.getElementById('undo-btn'),r=document.getElementById('redo-btn');
  if(u){u.disabled=!S.history.length;u.title=S.history.length?`Undo (${S.history.length})`:'Nothing to undo';}
  if(r){r.disabled=!S.future.length;r.title=S.future.length?`Redo (${S.future.length})`:'Nothing to redo';}
}

// ══════════════════════════════════════════════════════════════════════
// SINGLE-BRANCH DATA PIPELINE
// ══════════════════════════════════════════════════════════════════════
function getRemoveSet(){
  if(!S.removeSkuCol||!S.removeData.length)return new Set();
  return new Set(S.removeData.map(r=>String(r[S.removeSkuCol]??'').trim()));
}
function getEffectivePrice(sku,base){
  const e=parsePrice(S.priceEdits[sku]);return(!isNaN(e)&&e>0)?e:base;
}
function getProcessedData(){
  const rem=getRemoveSet();
  return S.mainData.map(row=>{
    const sku=String(row[S.skuCol]??'').trim();
    const isRem=rem.has(sku);
    if(S.stockCol){
      const raw=row[S.stockCol];const n=parseFloat(String(raw).replace(/,/g,''));
      return{...row,[S.stockCol]:(isRem||raw===''||raw===null||isNaN(n)||n<1)?0:n};
    }
    return row;
  });
}
function getFilteredForDiscount(){
  const processed=getProcessedData();
  const{search,originTypes,stockStatus,discStatus}=S.filters;
  return processed.filter(row=>{
    const sku=String(row[S.skuCol]??'').trim();
    const name=S.nameCol?String(row[S.nameCol]??'').trim():'';
    const stock=S.stockCol?parseFloat(row[S.stockCol])||0:1;
    const origin=S.originCol?String(row[S.originCol]??'').trim():'';
    const pct=parseFloat(S.discounts[sku]);const hasDisc=!isNaN(pct)&&pct>0;
    if(search&&!fuzzyMatch(search,sku)&&!fuzzyMatch(search,name))return false;
    if(originTypes.length&&!originTypes.includes(origin))return false;
    if(stockStatus==='active'&&stock===0)return false;
    if(stockStatus==='zero'&&stock>0)return false;
    if(discStatus==='disc'&&!hasDisc)return false;
    if(discStatus==='nodisc'&&hasDisc)return false;
    return true;
  });
}
function getFinalData(){
  return getProcessedData().map(row=>{
    const sku=String(row[S.skuCol]??'').trim();
    const base=parsePrice(row[S.priceCol]);
    const eff=getEffectivePrice(sku,base);
    const pct=parseFloat(S.discounts[sku]);
    const disc=(!isNaN(pct)&&pct>0)?+(eff*(1-pct/100)).toFixed(2):eff;
    return{...row,[S.priceCol]:eff,'__disc':disc,'__pct':isNaN(pct)?0:pct};
  });
}
function getUniqueOrigins(){
  if(!S.originCol)return[];
  const set=new Set();
  for(const row of S.mainData){const v=String(row[S.originCol]??'').trim();if(v)set.add(v);}
  return Array.from(set).sort();
}
function getStats(){
  const rem=getRemoveSet();let removed=0,zeroed=0,active=0;
  for(const row of S.mainData){
    const sku=String(row[S.skuCol]??'').trim();const isRem=rem.has(sku);
    if(isRem){removed++;continue;}
    const raw=S.stockCol?row[S.stockCol]:'';const n=parseFloat(String(raw).replace(/,/g,''));
    if(raw===''||raw===null||isNaN(n)||n<1)zeroed++;else active++;
  }
  return{total:S.mainData.length,removed,zeroed,active};
}
function defaultFilename(prefix){
  const d=new Date();
  const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  return`${prefix}-GPharmacy-${S.branch.replace(/\s+/g,'')}-${ymd}`;
}
function talabatDatePrefix(){
  const d=new Date();
  return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
function talabatPrice(salesPrice,name,originType){
  const n=String(name||'').toLowerCase();
  const isBaby=BABY_KW.some(k=>n.includes(k))||String(originType||'').trim()==='Baby Formulas';
  let adj=salesPrice>150?salesPrice-1:salesPrice>100?salesPrice-0.5:salesPrice-0.1;
  return isBaby?Math.ceil(adj*1.1/0.5)*0.5:+adj.toFixed(2);
}

// ══════════════════════════════════════════════════════════════════════
// MULTI-BRANCH DATA PIPELINE
// ══════════════════════════════════════════════════════════════════════
function normName(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ');}
function buildMerged(){
  const stockMap={};
  for(const row of S.stockData){
    const nm=normName(row[S.sNameCol]);
    if(nm)stockMap[nm]=row;
  }
  // Pre-build per-branch column resolver: exact col key → works; if not, find by label match
  const colResolvers={};
  for(const{label,col}of S.branchStockCols){
    if(!colResolvers[label])colResolvers[label]=(row)=>{
      // 1. Exact column name from mapping
      const v=row[col];if(v!==undefined&&v!==null&&v!=='')return v;
      // 2. Try case-insensitive partial match on row keys
      const lwr=label.toLowerCase();
      const fallbackKey=Object.keys(row).find(k=>k.toLowerCase().includes(lwr)||lwr.includes(k.toLowerCase()));
      return fallbackKey?row[fallbackKey]:'';
    };
  }
  const remSet=getMbRemoveSet();
  S.mbMerged=S.productData.map(row=>{
    const nm=normName(row[S.pNameCol]);
    const stockRow=stockMap[nm];
    const sku=String(row[S.pSkuCol]||'').trim();
    const isRemoved=remSet.has(sku);
    const price=parsePrice(row[S.pPriceCol]);
    const cost=parsePrice(row[S.pCostCol]);
    const pct=parseFloat(S.mbDiscounts[sku]);
    // Apply session-only price edits (not loaded from localStorage, so no cross-session bleed)
    const eff=S.mbPriceEdits[sku]!==undefined?parsePrice(S.mbPriceEdits[sku]):price;
    const disc=(!isNaN(pct)&&pct>0)?+(eff*(1-pct/100)).toFixed(2):eff;
    const stocks={};
    for(const{label}of S.branchStockCols){
      if(isRemoved){stocks[label]=0;continue;}
      const raw=stockRow?colResolvers[label](stockRow):'';
      const n=parseFloat(String(raw||'').replace(/,/g,''));
      stocks[label]=(!raw||isNaN(n)||n<1)?0:Math.floor(n);
    }
    return{
      sku,name:String(row[S.pNameCol]||''),
      barcode:String(row[S.pBarcodeCol]||''),
      price:eff,cost,disc,pct:isNaN(pct)?0:pct,
      origin:String(row[S.pOriginCol]||''),
      stocks,matched:!!stockRow,removed:isRemoved,
    };
  });
}

const SINGLE_STEPS=['Upload','Filter SKUs','Review','Discounts','Select Outputs','Export','Analytics'];
const MULTI_STEPS=['Products','Stock File','Filter SKUs','Discounts','Select Outputs','Export','Analytics'];

function render(){
  const c=document.getElementById('content');
  c.classList.remove('anim');void c.offsetWidth;c.classList.add('anim');
  if(!S.mode){c.innerHTML=renderModeSelect();document.getElementById('nav').innerHTML='';document.getElementById('step-badge').textContent='SELECT MODE';return;}
  const steps=S.mode==='single'?SINGLE_STEPS:MULTI_STEPS;
  document.getElementById('stepper')?null:null;
  if(!document.getElementById('stepper')){
    const st=document.createElement('div');st.id='stepper';st.className='stepper';
    c.parentNode.insertBefore(st,c);
  }
  document.getElementById('stepper').innerHTML=steps.map((l,i)=>{
    const cls=i===S.step?'active':i<S.step?'done':'';
    return`<div class="sdot ${cls}" onclick="jumpTo(${i})"><div class="scirc">${i<S.step?'✓':i+1}</div><div class="slabel">${l}</div></div>`;
  }).join('');
  document.getElementById('step-badge').textContent=`${S.mode.toUpperCase()} · STEP ${S.step+1}/${steps.length}`;
  if(S.mode==='single') c.innerHTML=[s0,s1,s2,s3,sSelect,s4,s5][S.step]();
  else c.innerHTML=[mb0,mb1,mb_remove,mb2,mbSelect,mb3,mb4][S.step]();
  document.getElementById('nav').innerHTML=renderNav(steps.length);
  bindEvents();
}
function renderNav(total){
  return`${S.step>0?'<button class="btn btn-ghost" onclick="goBack()">← Back</button>':'<span></span>'}
    ${S.step<total-1?`<button class="btn btn-primary" onclick="goNext()" ${canProceed()?'':'disabled'}>Continue →</button>`:'<span></span>'}`;
}
function canProceed(){
  if(S.mode==='single'&&S.step===0)return S.mainData.length>0&&!!S.skuCol;
  if(S.mode==='multi'&&S.step===0)return S.productData.length>0&&!!S.pSkuCol&&!!S.pNameCol&&!!S.pPriceCol;
  if(S.mode==='multi'&&S.step===1)return S.stockData.length>0&&!!S.sNameCol&&S.branchStockCols.length>0;
  // step 2 = Filter SKUs — always skippable
  return true;
}
function jumpTo(i){if(i<=S.step){S.step=i;render();}}
function goNext(){if(canProceed()){S.step++;render();}}
function goBack(){S.step=Math.max(0,S.step-1);render();}
function resetMode(){S.mode=null;S.step=0;saveMode();const st=document.getElementById('stepper');if(st)st.remove();render();}

function s5(){ // Analytics
  const data=getFinalData();
  const total=data.length;
  let active=0,disc=0,priceEd=0;
  const byOrigin={};
  let totalSaleVal=0,totalCostVal=0;
  for(const row of data){
    const sku=String(row[S.skuCol]??'').trim();
    const stock=S.stockCol?parseFloat(row[S.stockCol])||0:0;
    const price=parsePrice(row[S.priceCol]);
    const cost=S.costCol?parsePrice(row[S.costCol]):0;
    const pct=row['__pct']||0;
    const origin=S.originCol?String(row[S.originCol]??'').trim()||'Unknown':'Unknown';
    if(stock>0){active++;totalSaleVal+=price*stock;totalCostVal+=cost*stock;}
    if(pct>0)disc++;
    if(S.priceEdits[sku]!==undefined)priceEd++;
    if(!byOrigin[origin])byOrigin[origin]={total:0,active:0,disc:0,saleVal:0,costVal:0};
    byOrigin[origin].total++;
    if(stock>0){byOrigin[origin].active++;byOrigin[origin].saleVal+=price*stock;byOrigin[origin].costVal+=cost*stock;}
    if(pct>0)byOrigin[origin].disc++;
  }
  const bl=S.analyticsBaseline;
  const pctActive=total?+(active/total*100).toFixed(1):0;
  const pctDisc=total?+(disc/total*100).toFixed(1):0;
  const pctDiscOfActive=active?+(disc/active*100).toFixed(1):0;
  function delta(c,p,sfx=''){
    if(p===undefined||p===null)return`<span class="delta-nc">—</span>`;
    const d=c-p;if(d===0)return`<span class="delta-nc">±0${sfx}</span>`;
    return`<span class="${d>0?'delta-up':'delta-dn'}">${d>0?'↑+':'↓'}${Math.abs(d).toFixed(sfx?1:0)}${sfx}</span>`;
  }
  const stats=[
    {l:'Total SKUs',n:total,bl:bl?.total},{l:'Active (Stock>0)',n:active,bl:bl?.active},
    {l:'Zero Stock',n:total-active,bl:bl?(bl.total-bl.active):null},{l:'Discounted',n:disc,bl:bl?.disc},
    {l:'% Active',n:pctActive,bl:bl?.pctActive,sfx:'%'},{l:'% Disc of Total',n:pctDisc,bl:bl?.pctDisc,sfx:'%'},
    {l:'% Disc of Active',n:pctDiscOfActive,bl:bl?.pctDiscOfActive,sfx:'%'},
    {l:'Inventory (Sale)',n:totalSaleVal.toFixed(0)+' EGP',bl:null,raw:true},
    {l:'Inventory (Cost)',n:totalCostVal.toFixed(0)+' EGP',bl:null,raw:true},
  ];
  const statsHtml=`<div class="ana-grid">${stats.map(s=>`
    <div class="ana-stat">
      <div class="ana-stat-left"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>
      <div class="ana-delta">${s.raw?'':delta(parseFloat(s.n),s.bl,s.sfx||'')}</div>
    </div>`).join('')}</div>`;
  const originRows=Object.entries(byOrigin).sort((a,b)=>b[1].total-a[1].total).map(([o,d])=>{
    const pA=d.total?+(d.active/d.total*100).toFixed(1):0;
    const pDs=d.active?+(d.disc/d.active*100).toFixed(1):0;
    return`<tr><td>${esc(o)}</td><td>${d.total}</td><td>${d.active}</td><td>${pA}%</td>
      <td>${d.disc}</td><td>${pDs}%</td>
      <td style="font-family:var(--mono)">${d.saleVal.toFixed(0)} EGP</td>
      <td style="font-family:var(--mono)">${d.costVal.toFixed(0)} EGP</td></tr>`;
  }).join('');
  return`
  <div class="panel-head"><h2>Analytics</h2><p>Current session stats${bl?` vs baseline ${new Date(bl.ts).toLocaleDateString()}`:''}.</p></div>
  ${statsHtml}
  ${S.originCol?`<div class="card"><div class="card-label">By Origin Type</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Type</th><th>Total</th><th>Active</th><th>%Active</th><th>Disc</th><th>%Disc/Active</th><th>Sale Value</th><th>Cost Value</th></tr></thead>
      <tbody>${originRows}</tbody>
    </table></div></div>`:''}
  <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px">
    <button class="btn btn-primary btn-sm" onclick="saveBaseline()">💾 Save Baseline</button>
    ${bl?`<button class="btn btn-red btn-sm" onclick="clearBaseline()">✕ Clear Baseline</button>`:''}
    ${GAS_URL&&S.isAdmin?`<button class="btn btn-blue btn-sm" onclick="openVersionHistory()">🕐 Version History</button>
    <button class="btn btn-ghost btn-sm" onclick="openChangePassword()">🔑 Change Password</button>`:''}
    <button class="btn btn-ghost btn-sm" onclick="openGasUrlConfig()">⚙ Server Setup</button>
  </div>
  ${!bl?'<div class="alert alert-info">ℹ️ Save as baseline to track changes over time.</div>':''}
  <div class="alert alert-info" style="cursor:pointer" onclick="toggleAuditPanel()">📋 View full price audit log → click here</div>`;
}

function mb2(){ // Discounts (multi-branch) — full feature parity with single mode
  buildMerged();
  const rows=S.mbMerged;
  const total=rows.length,matched=rows.filter(r=>r.matched).length;
  const origins=[...new Set(rows.map(r=>r.origin).filter(Boolean))].sort();
  const{search,originTypes,stockStatus,discStatus}=S.filters;

  const visible=rows.filter(r=>{
    if(search&&!fuzzyMatch(search,r.sku)&&!fuzzyMatch(search,r.name))return false;
    if(originTypes.length&&!originTypes.includes(r.origin))return false;
    // stock status: check if ANY branch has stock
    const anyActive=Object.values(r.stocks).some(v=>v>0);

    if(stockStatus==='zero'&&anyActive)return false;
    if(discStatus==='disc'&&!(r.pct>0))return false;
    if(discStatus==='nodisc'&&r.pct>0)return false;
    return true;
  });

  const pages=Math.ceil(visible.length/PAGE_SIZE)||1;
  const page=Math.min(S.discPage,pages-1);
  const pageRows=visible.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);

  const stockChips=[{k:'all',l:'All'},{k:'active',l:'Active',cls:'s-active'},{k:'zero',l:'Zero',cls:'s-zero'}];
  const discChips=[{k:'all',l:'All'},{k:'disc',l:'Discounted',cls:'d-disc'},{k:'nodisc',l:'No Discount'}];

  const trows=pageRows.map(r=>`<tr>
    <td>${esc(r.sku)}</td>

function mb4(){ // Analytics (multi-branch)
  buildMerged();
  const rows=S.mbMerged;
  const total=rows.length;
  const byOrigin={};
  const branchActive={},branchSaleVal={},branchCostVal={};
  for(const{label}of S.branchStockCols){branchActive[label]=0;branchSaleVal[label]=0;branchCostVal[label]=0;}
  let totalActive=0,totalDisc=0;
  for(const r of rows){
    const origin=r.origin||'Unknown';
    if(!byOrigin[origin])byOrigin[origin]={total:0,active:0,disc:0};
    byOrigin[origin].total++;
    let anyActive=false;
    for(const{label}of S.branchStockCols){
      const st=r.stocks[label]||0;
      if(st>0){branchActive[label]++;branchSaleVal[label]+=r.price*st;branchCostVal[label]+=r.cost*st;anyActive=true;}
    }
    if(anyActive){totalActive++;byOrigin[origin].active++;}
    if(r.pct>0){totalDisc++;byOrigin[origin].disc++;}
  }
  const pctActive=total?+(totalActive/total*100).toFixed(1):0;
  const pctDisc=totalActive?+(totalDisc/totalActive*100).toFixed(1):0;
  return`
  <div class="panel-head"><h2>Analytics</h2></div>
  <div class="stats-grid">
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">Total Products</div></div>
    <div class="stat blue"><div class="stat-n">${totalActive}</div><div class="stat-l">Active (any branch)</div></div>
    <div class="stat yellow"><div class="stat-n">${pctActive}%</div><div class="stat-l">% Active</div></div>
    <div class="stat pu"><div class="stat-n">${pctDisc}%</div><div class="stat-l">% Disc of Active</div></div>
  </div>
  <div class="card">
    <div class="card-label">Branch Inventory</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Branch</th><th>Active SKUs</th><th>Sale Value (EGP)</th><th>Cost Value (EGP)</th></tr></thead>
      <tbody>${S.branchStockCols.map(({label})=>`<tr>
        <td><strong>${esc(label)}</strong></td>
        <td>${branchActive[label]}</td>
        <td style="font-family:var(--mono)">${(branchSaleVal[label]||0).toFixed(0)}</td>
        <td style="font-family:var(--mono)">${(branchCostVal[label]||0).toFixed(0)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>
  <div class="card">
    <div class="card-label">By Origin Type</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Type</th><th>Total</th><th>Active</th><th>%Active</th><th>Discounted</th><th>%Disc/Active</th></tr></thead>
      <tbody>${Object.entries(byOrigin).sort((a,b)=>b[1].total-a[1].total).map(([o,d])=>{
        const pA=d.total?+(d.active/d.total*100).toFixed(1):0;
        const pD=d.active?+(d.disc/d.active*100).toFixed(1):0;
        return`<tr><td>${esc(o)}</td><td>${d.total}</td><td>${d.active}</td><td>${pA}%</td><td>${d.disc}</td><td>${pD}%</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

// PAGER
// ══════════════════════════════════════════════════════════════════════
function buildPager(cur,total,key){
  if(total<=1)return'';
  let pages=[];
  if(total<=7)pages=Array.from({length:total},(_,i)=>i);
  else{pages=[0];if(cur>2)pages.push('…');for(let i=Math.max(1,cur-1);i<=Math.min(total-2,cur+1);i++)pages.push(i);if(cur<total-3)pages.push('…');pages.push(total-1);}
  return`<div class="pager">${pages.map(p=>p==='…'?`<span style="color:var(--mu);padding:0 3px">…</span>`
    :`<div class="pg ${p===cur?'on':''}" onclick="setPage('${key}',${p})">${p+1}</div>`).join('')}
    <span class="pg-info">${cur+1}/${total}</span></div>`;
}

function renderDiscTable(){
  const filtered=getFilteredForDiscount();
  const pages=Math.ceil(filtered.length/PAGE_SIZE)||1;
  const page=Math.min(S.discPage,pages-1);
  const rows=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
  const hasBc=!!S.barcodeCol,hasOr=!!S.originCol,hasNm=!!S.nameCol,hasPr=!!S.priceCol,hasSt=!!S.stockCol;
  const trows=rows.map(row=>{
    const sku=String(row[S.skuCol]||'').trim();
    const stock=hasSt?parseFloat(row[S.stockCol])||0:'-';
    const base=parsePrice(row[S.priceCol]);
    const eff=getEffectivePrice(sku,base);
    const wasEdited=S.priceEdits[sku]!==undefined;
    const pct=S.discounts[sku]!==undefined?S.discounts[sku]:'';
    const pctNum=parseFloat(pct);
    const discP=(!isNaN(pctNum)&&pctNum>0)?(eff*(1-pctNum/100)).toFixed(2):eff.toFixed(2);
    const hasDisc=!isNaN(pctNum)&&pctNum>0;
    return`<tr>
      <td>${esc(sku)}</td>
      ${hasNm?`<td style="max-width:170px;overflow:hidden;text-overflow:ellipsis" title="${esc(String(row[S.nameCol]||''))}">${esc(String(row[S.nameCol]||'').slice(0,28))}</td>`:''}
      ${hasSt?`<td class="${stock===0?'zero':''}">${stock}</td>`:''}
      ${hasPr?`<td class="${wasEdited?'edited':''}">${eff.toFixed(2)}${wasEdited?' ✎':''}</td>`:''}
      <td><input type="number" min="0" max="100" step="0.1" value="${esc(String(pct))}" placeholder="0" data-sku="${esc(sku)}" class="disc-row-in" ${(!S.isAdmin&&GAS_URL)?`disabled title="Admin login required — click ✎ Request to ask for a change" onclick="requestRowDiscount('${esc(sku)}',${eff})"`:`oninput="rowDiscChange(this)" onblur="_discSnapPending=null"`} style="width:72px"></td>
      ${hasPr?`<td class="${hasDisc?'disc':''}">${discP}</td>`:''}
      ${hasOr?`<td style="color:var(--mu);font-size:11px">${esc(String(row[S.originCol]||''))}</td>`:''}
      ${hasPr?`<td><button class="edit-btn" onclick="openPriceEditModal('${esc(sku)}',${eff})">✎</button></td>`:''}
    </tr>`;
  }).join('');
  const heads=['SKU',hasNm&&'Name',hasSt&&'Stock',hasPr&&'Price','Disc%',hasPr&&'Disc.Price',hasOr&&'Origin',''].filter(Boolean);
  return`<div class="card">
    <div class="card-label">Discount Table <span style="color:var(--mu);font-size:11px;margin-left:4px">${filtered.length} matching · page ${page+1}/${pages}</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${trows||'<tr><td colspan="10" style="text-align:center;color:var(--mu);padding:16px">No items match</td></tr>'}</tbody>
    </table></div>
    ${buildPager(page,pages,'disc')}
  </div>`;
}

  const w=document.getElementById('disc-table-wrap');if(w)w.innerHTML=renderDiscTable();

function setupDrop(dzId,inputId,cb){
  const dz=document.getElementById(dzId);if(!dz)return;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)cb(f);});
  const inp=document.getElementById(inputId);if(inp)inp.onchange=e=>{if(e.target.files[0])cb(e.target.files[0]);};
}

function loadStock(f){

function applyDiscSheet(){
  if(!S.discFileSkuCol||!S.discFilePctCol){toast('Map SKU and Discount % columns first.','er');return;}
  const preview={...S.discounts};let previewCount=0;
  for(const row of S.discFileData){
    const sku=String(row[S.discFileSkuCol]||'').trim();
    const rawPct=String(row[S.discFilePctCol]||'').replace(/[%,\s]/g,'');
    const pct=parseFloat(rawPct);
    if(!sku||isNaN(pct)||pct<0||pct>100)continue;
    preview[sku]=String(pct);previewCount++;
  }
  if(!S.isAdmin && GAS_URL){
    requestApproval('saveDiscounts',`Upload discount sheet (${previewCount} SKUs)`,{discounts:preview});
    return;
  }
  snapshotHistory();let count=0,skipped=0;
  for(const row of S.discFileData){
    const sku=String(row[S.discFileSkuCol]||'').trim();
    // Strip %, spaces, commas — keep digits and decimal point
    const rawPct=String(row[S.discFilePctCol]||'').replace(/[%,\s]/g,'');
    const pct=parseFloat(rawPct);
    if(!sku){skipped++;continue;}
    if(isNaN(pct)||pct<0||pct>100){skipped++;continue;}
    const old=parseFloat(S.discounts[sku])||0;
    S.discounts[sku]=String(pct);
    const email=S.auditEmail||'sheet-upload';
    S.auditLog.push({sku,oldDisc:old,newDisc:pct,email,ts:Date.now(),type:'discount-sheet-upload'});
    count++;
  }
  saveDisc();saveAudit();cloudSaveDiscounts();
  updateDiscTable();updateUndoRedoBtns();renderAuditPanel();
  toast(`Applied: ${count} SKUs updated.${skipped?` ${skipped} skipped`:''}`,'success');
}

  if(!S.isAdmin && GAS_URL){
    requestApproval('saveDiscounts',`Upload discount sheet — multi-branch (${previewCount} SKUs)`,{discounts:preview});
    return;
  }
  snapshotHistory();let count=0,skipped=0;
  const skuSet=new Set(S.mbMerged.map(r=>r.sku));
  for(const row of S.mbDiscData){
    const sku=String(row[S.mbDiscSkuCol]||'').trim();
    const rawPct=String(row[S.mbDiscPctCol]||'').replace(/[%,\s]/g,'');
    const pct=parseFloat(rawPct);
    if(!sku||!skuSet.has(sku)){skipped++;continue;}
    if(isNaN(pct)||pct<0||pct>100){skipped++;continue;}
    const old=parseFloat(S.mbDiscounts[sku])||0;
    S.mbDiscounts[sku]=String(pct);
    const email=S.auditEmail||'sheet-upload';
    S.auditLog.push({sku,oldDisc:old,newDisc:pct,email,ts:Date.now(),type:'discount-mb-sheet-upload'});
    count++;
  }
  saveMbDisc();saveAudit();renderAuditPanel();render();
  toast(`Applied: ${count} SKUs updated.${skipped?` ${skipped} skipped`:''}`,'success');
}

function dlExcel(rows,cols,mapFn,filename,driveFolder){
  const data=rows.map(r=>Object.fromEntries(cols.map(c=>[c,mapFn(c,r)])));
  const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();

  if(GAS_URL&&S.isAdmin&&driveFolder){

    driveUpload(b64,filename+'.xlsx',driveFolder,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
      .then(r=>{if(r)toast('Saved to Drive: '+driveFolder,'info');});
  }
}

function buildTalabatCSV(rows){
  const hdr=['SKU','reason','start_date','end_date','Campaign_status','discounted_price','max_no_of_orders','Price','active','maximum_sales_quantity'];
  return[hdr.map(h=>`"${h}"`).join(','),...rows.map(r=>{
    const talP=talabatPrice(r.price,r.name,r.origin);
    const discP=r.discPrice<r.price?r.discPrice:'';
    const vals={SKU:r.sku,reason:'',start_date:'',end_date:'',Campaign_status:'',discounted_price:discP,max_no_of_orders:'',Price:talP,active:r.stock>0?1:0,maximum_sales_quantity:Math.max(0,Math.floor(Number(r.stock)||0))};
    return hdr.map(h=>`"${vals[h]??''}"`).join(',');
  })].join('\r\n');
}
function triggerCSV(csv,fn,driveFolder){
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;
  document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
  if(GAS_URL&&S.isAdmin&&driveFolder){
    try{const b64=btoa(unescape(encodeURIComponent(csv)));
    driveUpload(b64,fn,driveFolder,'text/csv').then(r=>{if(r&&r.ok)toast('Saved to Drive: '+driveFolder,'info');});}catch(e){}
  }
}
function talabatPfx(){const d=new Date();return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function downloadTalabat(type){

  const fn=type==='NCTGO'?`${pfx}NCTGO_773863.csv`:type==='NCTMP'?`${pfx}NCTMP_774003.csv`:`${pfx}HE_774002.csv`;
  triggerCSV(csv,fn,'Talabat');

async function downloadAllSingle(){
  const sel=S.selectedOutputs;
  const isNC=S.branch==='New Cairo';
  const delay=ms=>new Promise(r=>setTimeout(r,ms));
  if(sel.chefaa){downloadChefaa();await delay(600);}
  if(sel.vezeeta){downloadVezeeta();await delay(600);}
  if(sel.instashop){downloadInstashop();await delay(600);}
  if(sel.talabat){
    if(isNC){downloadTalabat('NCTGO');await delay(600);downloadTalabat('NCTMP');await delay(600);}
    else{downloadTalabat('HE');await delay(600);}
  }
  if(sel.stock){downloadStockList();}
}
// ── Download All (multi-branch mode) ──
async function downloadAllMb(){
  buildMerged();
  const sel=S.mbSelectedOutputs;
  const brLabels=S.branchStockCols.map(b=>b.label);
  const delay=ms=>new Promise(r=>setTimeout(r,ms));
  if(sel.chefaa){mbDownloadChefaa();await delay(600);}
  if(sel.vezeeta){mbDownloadVezeeta();await delay(600);}
  if(sel.instashop){for(const lbl of brLabels){mbDownloadInstashop(lbl);await delay(600);}}
  if(sel.talabat){
    for(const lbl of brLabels){
      const isNC=lbl.toLowerCase().replace(/\s/g,'').includes('newcairo');
      if(isNC){mbDownloadTalabat('NCTGO',lbl);await delay(600);mbDownloadTalabat('NCTMP',lbl);await delay(600);}
      else{mbDownloadTalabat('HE',lbl);await delay(600);}
    }
  }
  // Promo: skip in Download All (requires date input via modal)
  if(sel.stock){mbDownloadStockList();}
  if(sel.promo){toast('Promotion files require campaign dates — please download them individually using the Promotion Sheet buttons above.');}
}

function openGmail(key){

// ── Promotion Sheet ──
function openPromoModal(branchLabel,fileType){
  const today=new Date();
  const toISO=d=>d.toISOString().slice(0,10);
  const firstOfMonth=new Date(today.getFullYear(),today.getMonth(),1);
  const lastOfMonth=new Date(today.getFullYear(),today.getMonth()+1,0);
  const pfx=talabatPfx();
  const fn=fileType==='NCTGO'?`${pfx}NCTGO_773863.csv`:fileType==='NCTMP'?`${pfx}NCTMP_774003.csv`:`${pfx}HE_774002.csv`;
  openModal(`<button type="button" class="modal-close" onclick="closeModal()">✕</button>
    <h3>📅 Promotion — ${esc(fn)}</h3>
    <p>Only discounted items included. Set campaign dates.</p>
    <div class="fgrid" style="margin-bottom:14px">
      <div class="fg"><label>Start Date</label><input type="date" id="promo-start" value="${toISO(firstOfMonth)}"></div>
      <div class="fg"><label>End Date</label><input type="date" id="promo-end" value="${toISO(lastOfMonth)}"></div>
    </div>
    <div class="alert alert-info">ℹ️ max_no_of_orders = <strong>1000</strong> · Campaign_status = 1 for discounted items · Barcode, reason, active, maximum_sales_quantity left empty.</div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="downloadPromoCSV('${esc(branchLabel)}','${esc(fileType||'HE')}')">⬇ Download ${esc(fn)}</button>
      <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>`);
}
function downloadPromoCSV(branchLabel,fileType){
  buildMerged();
  const startDate=(document.getElementById('promo-start')?.value||'').trim();
  const endDate=(document.getElementById('promo-end')?.value||'').trim();
  if(!startDate||!endDate){toast('Please set both start and end dates.','er');return;}
  const lbl=branchLabel;
  const headers=['SKU','Barcode','reason','start_date','end_date','Campaign_status','discounted_price','max_no_of_orders','Price','active','maximum_sales_quantity'];
  const lines=[headers.map(h=>`"${h}"`).join(',')];
  for(const r of S.mbMerged){
    const talP=talabatPrice(r.price,r.name,r.origin);
    const hasDisc=r.pct>0;
    const talDiscP=hasDisc?+(talP*(1-r.pct/100)).toFixed(2):'';
    const vals={
      SKU:r.sku,Barcode:'',reason:'',
      start_date:hasDisc?`'${startDate}`:'',
      end_date:hasDisc?`'${endDate}`:'',
      Campaign_status:hasDisc?1:'',
      discounted_price:talDiscP,
      max_no_of_orders:hasDisc?1000:'',
      Price:talP,
      active:'',maximum_sales_quantity:'',
    };
    lines.push(headers.map(h=>`"${vals[h]??''}"`).join(','));
  }
  const pfx=talabatPfx();
  const fn=fileType==='NCTGO'?`${pfx}NCTGO_773863.csv`:fileType==='NCTMP'?`${pfx}NCTMP_774003.csv`:`${pfx}HE_774002.csv`;
  triggerCSV(lines.join('\r\n'),fn);
  closeModal();
}

// ANALYTICS — SINGLE MODE BASELINE
// ══════════════════════════════════════════════════════════════════════
function saveBaseline(){
  const data=getFinalData();let active=0,disc=0,priceEd=0;
  const byOrigin={};let ts=Date.now(),total=data.length;
  for(const row of data){
    const sku=String(row[S.skuCol]??'').trim();
    const stock=S.stockCol?parseFloat(row[S.stockCol])||0:0;
    const pct=row['__pct']||0;
    const origin=S.originCol?String(row[S.originCol]??'').trim()||'Unknown':'Unknown';
    if(stock>0)active++;if(pct>0)disc++;if(S.priceEdits[sku]!==undefined)priceEd++;
    if(!byOrigin[origin])byOrigin[origin]={total:0,active:0,disc:0};
    byOrigin[origin].total++;if(stock>0)byOrigin[origin].active++;if(pct>0)byOrigin[origin].disc++;
  }
  const pctActive=total?+(active/total*100).toFixed(1):0;
  const pctDisc=total?+(disc/total*100).toFixed(1):0;
  const pctDiscOfActive=active?+(disc/active*100).toFixed(1):0;
  S.analyticsBaseline={total,active,disc,priceEd,pctActive,pctDisc,pctDiscOfActive,byOrigin,ts};
  localStorage.setItem(LS.ana,JSON.stringify(S.analyticsBaseline));render();
}
function clearBaseline(){localStorage.removeItem(LS.ana);S.analyticsBaseline=null;render();}

function discardSessionPriceEdits(){
  S.priceEdits={};S.mbPriceEdits={};
  savePE();saveMbPE();
  closeModal();
  if(S.step>0)render();
}
